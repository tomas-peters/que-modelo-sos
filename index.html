<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Qué modelo sos?">
<title>¿Cuál es tu modelo experimental?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --violeta:#6C4AB6;
    --violeta-osc:#4c3183;
    --coral:#FF6F91;
    --menta:#2EC4B6;
    --amarillo:#FFC145;
    --texto:#241b35;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;}
  html{height:-webkit-fill-available;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:'Nunito',sans-serif;
    color:var(--texto);
    background:linear-gradient(160deg,#f5f0ff 0%,#fff 45%,#eafff6 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    padding-top:max(20px, env(safe-area-inset-top));
    padding-bottom:max(20px, env(safe-area-inset-bottom));
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
    position:relative;
    overscroll-behavior-y:contain;
  }
  @media (max-height:640px){
    body{align-items:flex-start;}
  }
  body::before,body::after{
    content:"";position:fixed;width:360px;height:360px;border-radius:50%;
    filter:blur(70px);opacity:.30;z-index:0;pointer-events:none;
  }
  body::before{background:var(--coral);top:-120px;left:-120px;}
  body::after{background:var(--menta);bottom:-140px;right:-120px;}
  .deco{position:fixed;font-size:32px;opacity:.16;z-index:0;pointer-events:none;animation:flotar 6s ease-in-out infinite;}
  @keyframes flotar{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(8deg);}}

  /* --- moscas volando de un lado al otro de la pantalla --- */
  .mosca-volando{position:fixed;font-size:22px;opacity:.35;z-index:0;pointer-events:none;animation-name:volar-cruzar;animation-timing-function:linear;animation-iteration-count:infinite;}
  @keyframes volar-cruzar{
    0%{transform:translate(-10vw,0) rotate(0deg);}
    25%{transform:translate(28vw,-22px) rotate(10deg);}
    50%{transform:translate(58vw,12px) rotate(-8deg);}
    75%{transform:translate(88vw,-16px) rotate(8deg);}
    100%{transform:translate(120vw,0) rotate(0deg);}
  }

  /* --- ratones correteando por el borde inferior --- */
  .raton-corriendo{position:fixed;bottom:4%;font-size:24px;opacity:.35;z-index:0;pointer-events:none;animation-name:correr;animation-timing-function:linear;animation-iteration-count:infinite;}
  @keyframes correr{
    0%{transform:translateX(-10vw) scaleX(1);}
    48%{transform:translateX(104vw) scaleX(1);}
    50%{transform:translateX(104vw) scaleX(-1);}
    98%{transform:translateX(-10vw) scaleX(-1);}
    100%{transform:translateX(-10vw) scaleX(1);}
  }

  /* --- celulas flotando que se van "dividiendo" (mitosis) --- */
  .celula-wrap{position:fixed;width:70px;height:34px;z-index:0;pointer-events:none;opacity:.4;}
  .celula-wrap .c{position:absolute;top:4px;width:26px;height:26px;border-radius:50%;left:22px;
    background:radial-gradient(circle at 35% 35%, #eafff6, var(--menta));
    box-shadow:0 0 0 2px rgba(46,196,182,.25) inset;
    animation-duration:5s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
  .celula-wrap .c1{animation-name:dividir-izq;}
  .celula-wrap .c2{animation-name:dividir-der;}
  @keyframes dividir-izq{
    0%{transform:translateX(0) scale(0);opacity:0;}
    12%{transform:translateX(0) scale(1);opacity:1;}
    45%{transform:translateX(0) scale(1);opacity:1;}
    70%{transform:translateX(-15px) scale(.78);opacity:1;}
    92%{transform:translateX(-15px) scale(.78);opacity:1;}
    100%{transform:translateX(-15px) scale(0);opacity:0;}
  }
  @keyframes dividir-der{
    0%{transform:translateX(0) scale(0);opacity:0;}
    12%{transform:translateX(0) scale(1);opacity:1;}
    45%{transform:translateX(0) scale(1);opacity:1;}
    70%{transform:translateX(15px) scale(.78);opacity:1;}
    92%{transform:translateX(15px) scale(.78);opacity:1;}
    100%{transform:translateX(15px) scale(0);opacity:0;}
  }

  @media (max-width:760px){ .deco, .mosca-volando, .raton-corriendo, .celula-wrap{display:none;} }

  h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0 0 10px;}
  #app{
    width:100%;
    max-width:560px;
    background:#fff;
    border-radius:28px;
    box-shadow:0 24px 60px rgba(76,49,131,0.20);
    padding:36px 30px;
    text-align:center;
    position:relative;
    z-index:1;
    overflow:hidden;
  }
  #app::before{
    content:"";position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,var(--coral),var(--amarillo),var(--menta),var(--violeta));
  }
  .contenido{animation:aparecer .4s cubic-bezier(.2,.8,.3,1);}
  @keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);}}
  .contenido.stagger > *{animation:aparecer .45s cubic-bezier(.2,.8,.3,1) both;}
  .contenido.stagger > *:nth-child(1){animation-delay:.02s;}
  .contenido.stagger > *:nth-child(2){animation-delay:.08s;}
  .contenido.stagger > *:nth-child(3){animation-delay:.14s;}
  .contenido.stagger > *:nth-child(4){animation-delay:.20s;}
  .contenido.stagger > *:nth-child(5){animation-delay:.26s;}
  .contenido.stagger > *:nth-child(6){animation-delay:.32s;}
  .contenido.stagger > *:nth-child(7){animation-delay:.38s;}
  .contenido.stagger > *:nth-child(8){animation-delay:.44s;}

  .subtitulo{color:#6b5c85;font-size:15px;margin-bottom:22px;line-height:1.5;}
  .disclaimer{color:#a996c4;font-size:12.5px;font-style:italic;margin-top:-14px;margin-bottom:20px;line-height:1.4;}
  .btn{
    display:inline-block;
    border:none;
    cursor:pointer;
    font-family:'Baloo 2',sans-serif;
    font-size:17px;
    font-weight:600;
    padding:14px 26px;
    min-height:48px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--violeta),#8a6fd1);
    color:#fff;
    margin:8px 6px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 0 var(--violeta-osc);
    touch-action:manipulation;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--violeta-osc);}
  .btn.secundario{background:#fff;color:var(--violeta);border:2px solid var(--violeta);box-shadow:none;}
  .btn.chico{font-size:13px;padding:8px 14px;border-radius:12px;box-shadow:none;}

  #qr-box{display:flex;justify-content:center;margin:18px 0;}
  #qr-box canvas, #qr-box img{border-radius:14px;padding:10px;background:#fff;border:3px solid var(--violeta);}
  .qr-frame{display:inline-block;position:relative;padding:6px;}
  .qr-frame::before,.qr-frame::after,.qr-esq-a,.qr-esq-b{content:"";position:absolute;width:22px;height:22px;border:4px solid var(--amarillo);}
  .qr-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none;border-radius:8px 0 0 0;}
  .qr-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none;border-radius:0 0 8px 0;}
  .qr-esq-a{top:-4px;right:-4px;border-left:none;border-bottom:none;border-radius:0 8px 0 0;}
  .qr-esq-b{bottom:-4px;left:-4px;border-right:none;border-top:none;border-radius:0 0 0 8px;}

  .kicker{display:inline-block;background:linear-gradient(135deg,var(--amarillo),var(--coral));color:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;padding:5px 14px;border-radius:20px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.08);}

  /* --- matraz Erlenmeyer que se va llenando segun el progreso --- */
  .matraz-wrap{width:76px;height:96px;margin:0 auto 12px;}
  .matraz-wrap svg{width:100%;height:100%;overflow:visible;}
  .matraz-burbuja{animation:burbujear 2.6s ease-in infinite;}
  @keyframes burbujear{
    0%{transform:translateY(0);opacity:0;}
    15%{opacity:.9;}
    90%{opacity:.3;}
    100%{transform:translateY(-46px);opacity:0;}
  }
  .pregunta-num{color:#9a86bd;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:18px;}

  .pregunta-texto{font-size:21px;font-weight:600;margin-bottom:22px;font-family:'Baloo 2',sans-serif;}
  .opcion{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:#faf7ff;
    border:2px solid #e6d9f7;
    border-radius:16px;
    padding:13px 16px;
    margin-bottom:12px;
    font-size:15.5px;
    font-family:'Nunito',sans-serif;
    cursor:pointer;
    transition:.15s ease;
    touch-action:manipulation;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .opcion:hover{background:#f1e6ff;border-color:var(--violeta);transform:translateX(3px) scale(1.01);}
  .opcion:active{background:#f1e6ff;border-color:var(--violeta);}
  .opcion:disabled{cursor:default;}
  .opcion.seleccionada{background:#ece2fb;border-color:var(--violeta);transform:scale(1.02);box-shadow:0 6px 16px rgba(108,74,182,.18);}
  .opcion.apagada{opacity:.4;}
  .opcion-letra{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;color:#fff;
    transition:transform .2s ease;
  }
  .opcion.seleccionada .opcion-letra{transform:scale(1.15);}
  .nav-fila{display:flex;justify-content:space-between;margin-top:6px;}

  .badge-wrap{width:190px;height:190px;margin:0 auto 18px;position:relative;}
  .badge-wrap::before{
    content:"";position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle, var(--glow,var(--violeta)) 0%, transparent 70%);
    opacity:.35;animation:pulsar 2.8s ease-in-out infinite;
  }
  @keyframes pulsar{0%,100%{transform:scale(1);opacity:.28;}50%{transform:scale(1.12);opacity:.42;}}
  .badge-ring{position:absolute;inset:-9px;border-radius:50%;border:3px dashed #ccc;animation:girar 14s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .photo-frame{
    width:100%;height:100%;border-radius:50%;
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:6px solid #fff;
    box-shadow:0 8px 22px rgba(76,49,131,0.25);
  }
  .photo-frame .emoji-grande{font-size:84px;animation:entrada-emoji .5s cubic-bezier(.3,1.4,.5,1);}
  @keyframes entrada-emoji{from{transform:scale(0) rotate(-25deg);} to{transform:scale(1) rotate(0);}}
  .photo-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#9a86bd;font-weight:700;margin-bottom:6px;}
  .arquetipo-nombre{font-size:28px;margin-bottom:8px;}
  .resultado-frase{font-family:'Baloo 2',sans-serif;font-size:16px;color:var(--violeta);font-weight:600;margin-bottom:14px;font-style:italic;}
  .resultado-titulo{font-size:26px;margin-bottom:6px;}
  .resultado-desc{font-size:15.5px;line-height:1.55;color:#463a5e;text-align:left;background:#faf7ff;padding:16px 18px;border-radius:16px;margin-bottom:18px;}

  .chip-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:#a996c4;font-weight:700;margin:14px 0 8px;text-align:left;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{padding:6px 13px 6px 10px;border-radius:20px;font-size:13px;font-weight:700;font-family:'Baloo 2',sans-serif;display:inline-flex;align-items:center;gap:5px;}
  .chip.virtud{background:#e3f9f2;color:#128a6e;}
  .chip.defecto{background:#fff1e2;color:#c9721f;}

  .perfil-titulo{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#9a86bd;font-weight:700;text-align:left;margin-bottom:10px;}
  .footer-nota{font-size:12px;color:#a996c4;margin-top:18px;}

  .barra-stat{margin-bottom:14px;text-align:left;}
  .barra-stat .etiqueta{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;margin-bottom:5px;}
  .barra-fondo{background:#eee0f7;border-radius:14px;height:20px;overflow:hidden;}
  .barra-rellena{height:100%;border-radius:14px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;}
  .total-participantes{font-size:14px;color:#6b5c85;margin:14px 0;}

  .confetti{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:caer linear forwards;z-index:999;}
  @keyframes caer{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
  .top-link{position:absolute;top:14px;right:18px;font-size:12px;color:#b3a3d1;cursor:pointer;text-decoration:underline;z-index:2;}

  /* --- flash de color al revelar el resultado --- */
  .flash-pantalla{position:fixed;inset:0;z-index:998;pointer-events:none;animation:flashPop .55s ease forwards;}
  @keyframes flashPop{0%{opacity:0;}12%{opacity:.55;}100%{opacity:0;}}

  /* --- brillo que recorre ciertos botones --- */
  .btn.brillante{position:relative;overflow:hidden;}
  .btn.brillante::after{
    content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
    transform:skewX(-20deg);
    animation:brillo-btn 3.4s ease-in-out infinite;
  }
  @keyframes brillo-btn{0%{left:-60%;}45%{left:130%;}100%{left:130%;}}

  /* --- toggle de sonido, flotante en todas las pantallas --- */
  .sonido-toggle{
    position:fixed;top:16px;left:18px;z-index:5;background:#fff;border-radius:20px;
    padding:6px 13px;font-size:12px;font-weight:700;color:var(--violeta);
    box-shadow:0 4px 14px rgba(76,49,131,.18);cursor:pointer;font-family:'Baloo 2',sans-serif;
    user-select:none;
  }

  /* --- toast chiquito de confirmacion (ej: "copiado") --- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--texto);color:#fff;padding:11px 20px;border-radius:20px;
    font-size:13px;font-weight:700;font-family:'Baloo 2',sans-serif;opacity:0;
    transition:all .3s ease;z-index:1001;box-shadow:0 8px 22px rgba(0,0,0,.22);
    pointer-events:none;
  }
  .toast.mostrar{opacity:1;transform:translate(-50%,0);}

  /* --- grafico de torta para las stats en vivo --- */
  .pie-wrap{width:130px;height:130px;margin:6px auto 20px;position:relative;}
  .pie{position:absolute;inset:0;border-radius:50%;box-shadow:0 8px 20px rgba(76,49,131,.18);}
  .pie-hueco{position:absolute;inset:18px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #f0e9fb;}
  .pie-hueco .num{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:24px;color:var(--violeta);}
  .pie-hueco .lbl{font-size:9.5px;color:#a996c4;text-transform:uppercase;letter-spacing:.4px;}
</style>
</head>
<body>

<span class="deco" style="top:8%;left:6%;animation-delay:0s;">🧬</span>
<span class="deco" style="top:70%;left:4%;animation-delay:1.2s;">🔬</span>
<span class="deco" style="top:15%;right:6%;animation-delay:.6s;">🧪</span>

<!-- moscas volando de un lado al otro -->
<span class="mosca-volando" style="top:12%;animation-duration:13s;animation-delay:0s;">🪰</span>
<span class="mosca-volando" style="top:34%;animation-duration:17s;animation-delay:4s;">🪰</span>
<span class="mosca-volando" style="top:60%;animation-duration:15s;animation-delay:8s;">🪰</span>

<!-- ratones correteando por abajo -->
<span class="raton-corriendo" style="animation-duration:19s;animation-delay:0s;">🐭</span>
<span class="raton-corriendo" style="bottom:9%;animation-duration:23s;animation-delay:6s;">🐭</span>

<!-- celulas que aparecen, se dividen y se desvanecen -->
<div class="celula-wrap" style="top:20%;left:4%;">
  <div class="c c1" style="animation-delay:0s;"></div>
  <div class="c c2" style="animation-delay:0s;"></div>
</div>
<div class="celula-wrap" style="top:55%;right:5%;left:auto;">
  <div class="c c1" style="animation-delay:2.5s;"></div>
  <div class="c c2" style="animation-delay:2.5s;"></div>
</div>
<div class="celula-wrap" style="top:82%;left:8%;">
  <div class="c c1" style="animation-delay:1.3s;"></div>
  <div class="c c2" style="animation-delay:1.3s;"></div>
</div>

<div id="sonido-toggle" class="sonido-toggle" onclick="toggleSonido()">🔇 sonido</div>

<div id="app"></div>

<script>
/* ======================================================================
   CONFIGURACIÓN DEL JUEGO — esta es la parte que pueden editar a gusto
   con tus compañeros. No hace falta tocar nada más abajo de esta sección.
   ====================================================================== */

// Espacio de nombres del contador en vivo. Si van a usar el juego en OTRO
// seminario más adelante y quieren arrancar el conteo de cero, alcanza con
// cambiar este texto (por ejemplo agregar la fecha nueva).
const NAMESPACE = "leloir-seminario-becarios-2026-08-05";

// El juego revela primero un ARQUETIPO de personalidad, y recién después
// el modelo experimental asociado (como el Sombrero Seleccionador: primero
// dice qué tipo de persona sos, después a qué "casa" pertenecés).
// Ningún modelo es "mejor" que otro: cada uno tiene virtudes y defectos
// igual de simpáticos.
const RESULTADOS = {
  cultivo: {
    arquetipo: "El Arquitecto",
    arquetipoEmoji: "⚙️",
    organismo: "Cultivo celular",
    organismoEmoji: "🧫",
    color: "#2EC4B6",
    frase: "Si controlás suficientes variables, cualquier problema tiene solución.",
    virtudes: ["Organizado/a", "Eficiente", "Resolutivo/a", "Optimizador/a"],
    defectos: ["Controlador/a", "Ansioso/a sin el control", "Perfeccionista", "Obsesivo/a con el detalle"],
    descripcionArquetipo: "Tu forma de resolver problemas es simplificar, controlar y optimizar. Antes de actuar, reducís variables hasta quedarte con lo esencial. Rendís muchísimo en tu propio ambiente, con las condiciones bajo control — el problema es cuando alguien te las desordena sin avisar.",
    descripcionOrganismo: "Por eso tu modelo experimental es el cultivo celular: prospera solo si le das exactamente lo que necesita —temperatura, pH, esterilidad— sin sorpresas de por medio. Preferís pocas variables pero muy bien controladas, y experimentar con total libertad dentro de ese sistema cerrado. Ah, y no te tiembla el pulso para invertir en que el experimento salga perfecto."
  },
  drosophila: {
    arquetipo: "El Explorador",
    arquetipoEmoji: "🧭",
    organismo: "Drosophila melanogaster",
    organismoEmoji: "🪰",
    color: "#FFC145",
    frase: "Si sale mal, mañana hay otra generación para intentarlo de nuevo.",
    virtudes: ["Creativo/a", "Curioso/a", "Ingenioso/a", "Adaptable"],
    defectos: ["Improvisa de más", "Se distrae fácil", "Caos funcional", "Empieza mil cosas a la vez"],
    descripcionArquetipo: "Tu forma de resolver problemas es probar cosas nuevas. Confiás en la curiosidad y en que la respuesta va a aparecer experimentando, no pensando de más. Sos rápido/a y resolutivo/a, y no le tenés miedo al error — el costo es que a veces dejás puntas sueltas por el camino.",
    descripcionOrganismo: "Por eso tu modelo experimental es Drosophila melanogaster: barata, veloz, con una generación nueva cada diez días. El costo —económico y hasta ético— de probar muchas alternativas es bajo, así que podés iterar sin culpa y descartar lo que no funciona sin mirar atrás. Rendís muchísimo con poquísimos recursos, siempre a los saltos."
  },
  ratones: {
    arquetipo: "El Estratega",
    arquetipoEmoji: "🛡️",
    organismo: "Ratones de laboratorio",
    organismoEmoji: "🐭",
    color: "#FF6F91",
    frase: "Antes de mover una ficha, te asegurás de entender el tablero completo.",
    virtudes: ["Paciente", "Responsable", "Perseverante", "Buen/a planificador/a"],

/* ---------- pequeños efectos: sonido, vibración, flash, compartir ---------- */

function toggleSonido(){
  sonidoActivo = !sonidoActivo;
  const btn = document.getElementById("sonido-toggle");
  if(btn) btn.textContent = sonidoActivo ? "🔊 sonido" : "🔇 sonido";
  if(sonidoActivo) beep(660, .05);
}

function beep(frecuencia, duracion, tipo){
  if(!sonidoActivo) return;
  try{
    if(!window.__audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      window.__audioCtx = new Ctx();
    }
    const ctx = window.__audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipo || "sine";
    osc.frequency.value = frecuencia;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duracion);
    osc.stop(ctx.currentTime + duracion + 0.02);
  }catch(e){ /* si el navegador no soporta audio, seguimos sin sonido */ }
}

function vibrar(patron){
  try{ if(navigator.vibrate) navigator.vibrate(patron); }catch(e){}
}

function flashPantalla(color){
  try{
    const div = document.createElement("div");
    div.className = "flash-pantalla";
    div.style.background = color;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 600);
  }catch(e){}
}

function mostrarToast(mensaje){
  try{
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = mensaje;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add("mostrar"), 10);
    setTimeout(() => { t.classList.remove("mostrar"); setTimeout(() => t.remove(), 300); }, 2200);
  }catch(e){}
}

async function compartir(){
  const url = window.location.href.split("#")[0];
  const mensaje = `${ultimoTextoCompartir}\n${url}`;
  if(navigator.share){
    try{ await navigator.share({ text: mensaje }); return; }catch(e){ /* canceló o no soportado, seguimos abajo */ }
  }
  try{
    await navigator.clipboard.writeText(mensaje);
    mostrarToast("¡Copiado! Pegalo donde quieras 📋");
  }catch(e){
    window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, "_blank");
  }
}

function actualizarFavicon(emoji){
  try{
    const canvas = document.createElement("canvas");
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.font = "54px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, 32, 38);
    let link = document.querySelector("link[rel~='icon']");
    if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
    link.href = canvas.toDataURL();
  }catch(e){}
}


function render(){
  clearInterval(window.__statsInterval);
  // En celular es muy común quedar scrolleado hacia abajo leyendo una pregunta
  // larga; al cambiar de pantalla siempre arrancamos arriba del todo.
  try{ window.scrollTo(0, 0); }catch(e){}
  if(estado === "start") return renderStart();
  if(estado === "quiz") return renderQuiz();
  if(estado === "arquetipo") return renderArquetipo();
  if(estado === "resultado") return renderResultado();
  if(estado === "stats") return renderStats();
}

function seleccionarOpcion(i){
  // Pequeña pausa visual: resaltamos la opción elegida antes de pasar
  // a la siguiente pregunta, para que se sienta más "juego" y menos salto brusco.
  vibrar(12);
  beep(520, .05);
  const botones = document.querySelectorAll(".opcion");
  botones.forEach((b, idx) => {
    b.disabled = true;
    b.classList.add(idx === i ? "seleccionada" : "apagada");
  });
  setTimeout(() => responder(i), 240);
}

function responder(i){
  const cat = PREGUNTAS[preguntaActual].opciones[i].cat;
  respuestas[preguntaActual] = cat;
  if(preguntaActual < PREGUNTAS.length - 1){
    preguntaActual++;
    render();
  } else {
    // Si hay un ganador claro, primero mostramos el arquetipo de personalidad
    // (como el Sombrero Seleccionador) y recién después el modelo experimental.
    // Si empataron dos categorías, vamos directo al resultado combinado.
    const { ganadores } = calcularGanador();
    ir(ganadores.length === 1 ? "arquetipo" : "resultado");
  }
}

function atras(){
  preguntaActual = Math.max(0, preguntaActual - 1);
  render();
}

function calcularGanador(){
  const puntos = { drosophila: 0, cultivo: 0, ratones: 0 };
  respuestas.forEach(cat => { if(puntos[cat] !== undefined) puntos[cat]++; });
  const max = Math.max(...Object.values(puntos));
  const ganadores = Object.keys(puntos).filter(k => puntos[k] === max);
  return { ganadores, puntos };
}

  if(!yaConte){

    const paraContar = ganadores.length === 1 ? ganadores[0] : ganadores[Math.floor(Math.random() * ganadores.length)];
    contarResultado(paraContar);

    // el participante igual ve su resultado, solo no queda contado en las stats.
  });
}

function spawnConfetti(cat){
  const emojis = EMOJIS_CONFETTI[cat] || ["🎉","✨","🧬","🔬","🪰","🧫","🐭"];
  for(let i = 0; i < 22; i++){
    const span = document.createElement("span");
    span.className = "confetti";
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + "vw";
    span.style.animationDuration = (2 + Math.random() * 1.5) + "s";
    document.body.appendChild(span);
    setTimeout(() => span.remove(), 4000);
  }
}

async function obtenerConteo(cat){
  try{
    const res = await fetch(`https://abacus.jasoncameron.dev/get/${NAMESPACE}/${cat}`);
    const data = await res.json();
    return data.value || 0;
  }catch(e){
    return null;
  }
}

function renderStats(){
  app.innerHTML = `
    <div class="top-link" onclick="ir('start')">← volver</div>
    <div class="contenido">
      <h2>📊 ¿Qué eligió el público?</h2>
      <p class="subtitulo">Se actualiza solo cada pocos segundos.</p>
      <div id="stats-contenido"><p>Cargando...</p></div>
      <button class="btn secundario chico" onclick="cargarStats()">Actualizar ahora</button>
    </div>
  `;
  cargarStats();
  window.__statsInterval = setInterval(cargarStats, 8000);
}

async function cargarStats(){
  const cats = Object.keys(RESULTADOS);
  const valores = await Promise.all(cats.map(obtenerConteo));
  const cont = document.getElementById("stats-contenido");
  if(!cont) return;

  if(valores.some(v => v === null)){
    cont.innerHTML = `<p style="color:#c0527a">No se pudo conectar con el contador en este momento. Probá de nuevo en unos segundos.</p>`;
    return;
  }

  const total = valores.reduce((a,b) => a+b, 0);
  if(total === 0){
    cont.innerHTML = `<p>Todavía nadie jugó. ¡Sé el primero!</p>`;
    return;
  }

  // Armamos el gradiente cónico de la torta a partir de los % reales,
  // forzando que el último segmento cierre justo en 100% (por redondeos).
  let acumulado = 0;
  const segmentos = cats.map((cat, i) => {
    const pct = (valores[i] / total) * 100;
    const desde = acumulado;
    acumulado += pct;
    return `${RESULTADOS[cat].color} ${desde}% ${acumulado}%`;
  });

  cont.innerHTML = `
    <div class="pie-wrap">
      <div class="pie" style="background:conic-gradient(${segmentos.join(", ")})"></div>
      <div class="pie-hueco"><span class="num" id="pie-total">0</span><span class="lbl">jugaron</span></div>
    </div>
    <div class="total-participantes">Total de participantes: <strong>${total}</strong></div>
    ${cats.map((cat, i) => {
      const r = RESULTADOS[cat];
      const pct = Math.round((valores[i] / total) * 100);
      return `
        <div class="barra-stat">
          <div class="etiqueta"><span>${r.organismoEmoji} ${r.organismo}</span><span id="pct-${cat}">0%</span></div>
          <div class="barra-fondo"><div class="barra-rellena" style="width:${pct}%; background:${r.color}"></div></div>
        </div>
      `;
    }).join("")}
  `;

  animarNumero("pie-total", total);
  cats.forEach((cat, i) => {
    const pct = Math.round((valores[i] / total) * 100);
    animarNumero(`pct-${cat}`, pct, "%", ` (${valores[i]})`);
  });
}

// Anima un número subiendo de 0 al valor final (efecto "contador" en vivo).
function animarNumero(id, valorFinal, sufijo, extra){
  const el = document.getElementById(id);
  if(!el) return;
  sufijo = sufijo || "";
  extra = extra || "";
  const duracion = 600;
  const inicio = performance.now();
  function paso(ahora){
    const t = Math.min(1, (ahora - inicio) / duracion);
    const valor = Math.round(t * valorFinal);
    el.textContent = valor + sufijo + extra;
    if(t < 1) requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

render();
</script>
